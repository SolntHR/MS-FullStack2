spring.application.name=carrito-test
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# En las pruebas se usa H2 en memoria: Hibernate crea las tablas y Flyway no se ejecuta
spring.datasource.url=jdbc:h2:mem:carrito;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

jwt.secret=clave-de-pruebas-con-mas-de-32-caracteres-123
inventario.url=http://localhost:9999
