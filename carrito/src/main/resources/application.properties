spring.application.name=carrito
server.port=8084

# Base de datos: MySQL de Laragon (localhost:3306, usuario root sin contraseña).
# Si la base "carrito" no existe, se crea al iniciar (createDatabaseIfNotExist).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/carrito?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate solo valida que las tablas coincidan con las entidades; las tablas las crea Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway: ejecuta al iniciar las migraciones pendientes de src/main/resources/db/migracion
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migracion

# Misma clave que usuarios: así carrito puede verificar los tokens que emite usuarios
jwt.secret=${JWT_SECRET:sonido-vivo-clave-de-desarrollo-cambiar-en-produccion}

# Dirección de inventario. "inventario" es su nombre en Eureka (se resuelve con @LoadBalanced)
inventario.url=${INVENTARIO_URL:http://inventario}

springdoc.swagger-ui.path=/swagger-ui.html

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:false}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.instance-id=${spring.application.name}:${server.port}
